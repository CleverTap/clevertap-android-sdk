# CleverTap Android SDK detekt configuration (SDK-6378).
#
# Applied on top of detekt's default config (buildUponDefaultConfig = true), so only deviations
# from the defaults live here. Run the type-resolved task: ./gradlew :<module>:detektRelease
# Existing findings are baselined per module (<module>/detekt-baseline-release.xml); only new
# findings fail the build. Burn-down list: config/detekt/BASELINE_BURNDOWN.md

build:
  maxIssues: 0 # fail on any finding that is not in the baseline

config:
  validation: true          # unknown rules/properties fail fast
  warningsAsErrors: false

# ==============================================================================
# 1. SDK & LIBRARY API SAFETY (detekt-rules-libraries plugin, needs type resolution)
# ==============================================================================
# TODO(SDK-6378): requires the detekt-rules-libraries plugin (detekt 1.23.8), which could not be
# downloaded when this gate was introduced. With config.validation on, configuring a rule set that
# is not installed fails the run, so the block stays commented until the plugin is added.
# libraries:
#   active: true
#   # Public data classes break binary compatibility when a property is added (copy/componentN).
#   ForbiddenPublicDataClass:
#     active: true
#     ignorePackages:
#       - '*.internal'
#       - '*.internal.*'
#   # Explicit return types on public SDK functions/properties (redundant once explicitApi() is on).
#   LibraryCodeMustSpecifyReturnType:
#     active: true
#     allowOmitUnit: false
#   # Off on purpose: our public API is not confined to one package, so this would flag every real
#   # API type. The public surface is guarded precisely by binary-compatibility-validator
#   # (`./gradlew apiCheck`) and visibility was narrowed type by type during the Kotlin migration.
#   LibraryEntitiesShouldNotBePublic:
#     active: false

# ==============================================================================
# 2. PUBLIC DOCUMENTATION (shown as Javadoc/KDoc to SDK users)
# ==============================================================================
# These rules only look at public declarations; `internal`/`private` code is never flagged.
# @RestrictTo types are public to the JVM and will be flagged - they are in the baseline.
comments:
  active: true
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**']

# ==============================================================================
# 3. CLEAN CODE & COMPLEXITY (stricter than detekt defaults; existing code is baselined)
# ==============================================================================
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 30                 # default 60
  LargeClass:
    active: true
    threshold: 300                # default 600
  LongParameterList:
    active: true
    functionThreshold: 5
    constructorThreshold: 6
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 3                  # default 4
  CyclomaticComplexMethod:
    active: true
    threshold: 10                 # default 15
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 10

# ==============================================================================
# 4. STYLE, NAMING & JAVA-ISMS
# ==============================================================================
# "Callback as the last parameter" for Java lambda callers is enforced by Android lint's
# LambdaLast check, not by detekt.
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '100']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 2
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.print'
        reason: 'Log through com.clevertap.android.sdk.Logger'
      - value: 'kotlin.io.println'
        reason: 'Log through com.clevertap.android.sdk.Logger'
      - value: 'java.lang.Thread.sleep'
        reason: 'Never block SDK or host threads; schedule work on CTExecutors'
      - value: 'android.util.Log.v'
        reason: 'Log through com.clevertap.android.sdk.Logger (respects the configured debug level)'
      - value: 'android.util.Log.d'
        reason: 'Log through com.clevertap.android.sdk.Logger (respects the configured debug level)'
      - value: 'android.util.Log.i'
        reason: 'Log through com.clevertap.android.sdk.Logger (respects the configured debug level)'
      - value: 'android.util.Log.w'
        reason: 'Log through com.clevertap.android.sdk.Logger (respects the configured debug level)'
      - value: 'android.util.Log.e'
        reason: 'Log through com.clevertap.android.sdk.Logger (respects the configured debug level)'
  # Java interop needs `Void` as a type argument (Callable<Void>, Task<Void>, AsyncTask) - only flag
  # Void used as a plain Kotlin type.
  ForbiddenVoid:
    active: true
    ignoreOverridden: true
    ignoreUsageInGenerics: true
  # Non-const `val` constants compile to a private field + getter (Java then needs
  # X.Companion.getFOO()); `const val` gives Java a real static final field.
  MayBeConst:
    active: true
  # Repo convention: braces on every if/else.
  BracesOnIfStatements:
    active: true
    singleLine: 'always'
    multiLine: 'always'
  # Java-isms left by the Java->Kotlin migration (burned down in the follow-up pass).
  UseRequireNotNull:
    active: true
  UseCheckNotNull:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  UseLet:
    active: true
  UnnecessaryLet:
    active: true
  UseIsNullOrEmpty:
    active: true
  UseOrEmpty:
    active: true
  VarCouldBeVal:
    active: true
  CanBeNonNullable:               # type resolution
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
  VariableNaming:
    active: true
  ClassNaming:
    active: true
  PackageNaming:
    active: true

# ==============================================================================
# 5. EXCEPTIONS & NULL SAFETY
# ==============================================================================
# SDK policy: the SDK catches broadly (including Throwable) and may swallow failures on purpose so it
# never crashes or disturbs the host app (native, Flutter or React Native). Rules that fight that
# policy are OFF - do not re-enable them:
#   - TooGenericExceptionCaught: catching Exception/Throwable at SDK boundaries is intended.
#   - SwallowedException: not rethrowing is intended; failures are logged through Logger.
# Still on: PrintStackTrace (log through Logger instead), TooGenericExceptionThrown (don't throw
# raw Exception/RuntimeException), and empty-blocks' EmptyCatchBlock, which only asks to name a
# deliberately ignored exception `ignored`/`expected`/`_` so the intent is visible.
exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  PrintStackTrace:
    active: true

potential-bugs:
  active: true
  # Files without a package land in the default package (lives in potential-bugs, not style).
  MissingPackageDeclaration:
    active: true
  # Flags `!!` (type resolution). Prefer a single read + `?:`/`?.let`, or requireNotNull/checkNotNull
  # with a message where a crash is intended.
  UnsafeCallOnNullableType:
    active: true
  # `map[key]!!` -> getValue(key) or explicit handling.
  MapGetWithNotNullAssertionOperator:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  NullableToStringCall:
    active: true
  # A `var` holding a mutable collection: two ways to mutate the same state.
  DoubleMutabilityForCollection:
    active: true
  # Casts that can never succeed.
  UnsafeCast:
    active: true
  # toUpperCase()/toLowerCase()/String.format without a Locale: on a Turkish/Azeri device "I"
  # lower-cases to a dotless "ı", which silently changes event names and profile keys.
  # (Kotlin's lowercase()/uppercase() are locale-invariant and are fine.)
  ImplicitDefaultLocale:
    active: true
  # Deliberately OFF: the SDK uses lateinit for lifecycle-bound internals (views bound in
  # onCreateView, framework-injected fields). The real risk - a PUBLIC lateinit that a host app or
  # wrapper can read before it is set - is checked separately: no public-API type exposes one.
  LateinitUsage:
    active: false
