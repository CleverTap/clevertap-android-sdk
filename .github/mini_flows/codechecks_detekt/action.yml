name: 'Detekt Code Analysis'
description: 'Runs Detekt static code analysis on all modules and uploads reports'

runs:
  using: "composite"
  steps:

    # detektRelease = type-resolved analysis of main sources. The plain `detekt` task skips every
    # type-resolution rule (UnsafeCallOnNullableType, CanBeNonNullable, the libraries rule set).
    # Fails on any finding not in <module>/detekt-baseline-release.xml.
    - name: Run Detekt on All Modules (Parallel)
      if: always()
      shell: bash
      run: |
        ./gradlew \
          :clevertap-core:detektRelease \
          :clevertap-geofence:detektRelease \
          :clevertap-hms:detektRelease \
          :clevertap-pushtemplates:detektRelease \
          --continue \
          --parallel \
          --max-workers=4 \
          --build-cache

    # Baselines may only shrink: a regenerated baseline must not absorb new findings.
    - name: detekt baseline ratchet
      if: always()
      shell: bash
      run: bash config/detekt/baseline_ratchet.sh

    # Public API guards:
    #  - apiCheck (binary-compatibility-validator): public ABI must match <module>/api/*.api
    #  - apiInteropCheck: no NEW Java/Flutter/React Native interop hazards in the public API and no
    #    Kotlin `internal` declaration without @RestrictTo (baseline: config/api-interop/baseline.txt)
    - name: Public API checks (ABI + Java/hybrid interop)
      if: always()
      shell: bash
      run: |
        ./gradlew apiCheck apiInteropCheck --continue --build-cache

    # Consumer link check: shipped artifacts compiled against older SDKs (Signed Call, push-templates,
    # hms, geofence, Leanplum - config/api-interop/consumers.txt) must still link against the built
    # release classes (no NoSuchMethodError / IncompatibleClassChangeError / VerifyError). Downloads
    # the artifacts from Maven Central with curl; fails on findings not in
    # config/api-interop/consumer_link_baseline.txt.
    - name: Consumer link check (shipped artifacts vs this build)
      if: always()
      shell: bash
      run: |
        bash config/api-interop/fetch_consumers.sh build/consumer-jars
        ./gradlew consumerLinkCheck -PconsumerJarsDir=build/consumer-jars --build-cache

    - name: Upload All Detekt Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: detekt-reports
        path: |
          clevertap-core/build/reports/detekt
          clevertap-geofence/build/reports/detekt
          clevertap-hms/build/reports/detekt
          clevertap-pushtemplates/build/reports/detekt
