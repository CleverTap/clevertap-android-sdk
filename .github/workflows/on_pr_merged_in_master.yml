name: Release Sanity (Main branch updated)

# using https://stackoverflow.com/a/67833464/7500651
on:
  pull_request:
    branches: [master]
    types: [closed]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Code Quality Checks (Run in Parallel)
  lint:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Code Quality - lint
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: ./.github/mini_flows/setup_jdk

      - name: Run lint
        uses: ./.github/mini_flows/lint

  detekt:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Code Quality - detekt
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: ./.github/mini_flows/setup_jdk

      - name: Static Code Check Via detekt
        uses: ./.github/mini_flows/codechecks_detekt

  checkstyle:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Code Quality - checkstyle
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: ./.github/mini_flows/setup_jdk

      - name: Static Code Check Via checkstyle
        uses: ./.github/mini_flows/codechecks_checkstyle

  # Unit Tests and Coverage (Only after quality checks pass)
  test:
    needs: [lint, detekt, checkstyle]
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Unit Tests and Coverage
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: ./.github/mini_flows/setup_jdk

      - name: Unit Tests and Jacoco Coverage (DEBUG)
        uses: ./.github/mini_flows/test_and_coverage_debug

  # Build (Only after tests pass)
  build:
    needs: [test]
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Build Release AARs
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: ./.github/mini_flows/setup_jdk

      - name: Build Release AARs
        uses: ./.github/mini_flows/build_code_release

  # Notify the Bearded Robot test app (CleverTap/CT-Apps) that a new core
  # SDK version has landed on master, so it can open a version-bump PR.
  notify-br-app:
    needs: [build]
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Notify Bearded Robot of core release
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Resolve core SDK version
        id: version
        run: |
          VERSION=$(grep -E '^[[:space:]]*clevertap_android_sdk[[:space:]]*=' gradle/libs.versions.toml \
            | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve clevertap_android_sdk version from gradle/libs.versions.toml"
            exit 1
          fi
          echo "Resolved core SDK version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch core-sdk-released to CT-Apps
        env:
          GH_TOKEN: ${{ secrets.CT_APPS_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CT_APPS_DISPATCH_TOKEN is not set. Add a PAT with 'repo' scope on CleverTap/CT-Apps as a repo secret."
            exit 1
          fi
          echo "📣 Notifying CT-Apps: android core $VERSION released"
          PAYLOAD=$(printf '{"event_type":"core-sdk-released","client_payload":{"platform":"android","version":"%s"}}' "$VERSION")
          echo "$PAYLOAD" | gh api repos/CleverTap/CT-Apps/dispatches --method POST --input -
          echo "✅ Dispatch sent to CleverTap/CT-Apps."
