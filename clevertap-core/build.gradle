ext {
    libraryName = 'CleverTapAndroidSDK'
    artifact = 'clevertap-android-sdk'
    libraryDescription = 'The CleverTap Android SDK'

    libraryVersion = libs.versions.clevertap.android.sdk.get()

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
    minSdkVersionVal = libs.versions.android.minSdk.get().toInteger()
}

apply from: "../gradle-scripts/commons.gradle"

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    defaultConfig {
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    namespace 'com.clevertap.android.sdk'
    testNamespace 'com.clevertap.demo'
}

dependencies {
    // androidx.core stays compileOnly: the SDK compiles against 1.17.0 (for the Android-16
    // ProgressStyle / promotion APIs used by the opt-in progress-centric Live Update) but does
    // NOT force a version on consumers. Apps that don't use that feature keep their own core
    // version; apps that do add `androidx.core:core:1.17.0+` themselves (see TAN §15). The
    // progress renderer guards the native path at runtime so an older core at runtime degrades
    // to the RemoteViews fallback instead of crashing — so no published version constraint is
    // needed (a forcing `constraints { implementation(core) }` block would bump every consumer).
    compileOnly(libs.firebase.messaging)

    // For Media
    compileOnly(libs.bundles.exoplayer)
    compileOnly(libs.glide)
    compileOnly(libs.bundles.media3)

    //for notification
    compileOnly(libs.androidx.core.core)
    compileOnly(libs.androidx.viewpager)
    compileOnly(libs.android.material)
    compileOnly(libs.androidx.fragment)

    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.swiperefreshlayout)
    implementation(libs.androidx.lifecycle.process)
    implementation(libs.installreferrer)
    implementation(libs.androidx.work.runtime)

    // App rating system template
    compileOnly(libs.play.review)

    // Unit testing dependencies
    testImplementation(project(":test_shared"))
    // material is compileOnly for consumers; tests inflating inbox_activity.xml (TabLayout) need it at runtime
    testImplementation(libs.android.material)
    testImplementation(libs.firebase.messaging)
    testImplementation(libs.test.coroutines)

    // Instrumentation testing dependencies
    androidTestImplementation(libs.test.ext.junit)
    androidTestImplementation(libs.runner)
    androidTestImplementation(libs.rules)
    androidTestImplementation(libs.test.espresso.core)
    androidTestImplementation(libs.test.work.testing)
    testImplementation(libs.androidx.lifecycle.runtime.testing)
}

sonarqube {
    properties {
        property "sonar.projectKey", "CleverTap_clevertap-android-sdk"
        property "sonar.organization", "clevertap"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

