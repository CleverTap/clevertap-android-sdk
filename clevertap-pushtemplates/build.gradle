ext {
    libraryName = 'PushTemplates'
    artifact = 'push-templates'
    libraryDescription = 'The CleverTap Android Push Templates SDK'

    libraryVersion = libs.versions.clevertap.push.templates.sdk.get()

    licenseName = 'MIT License'
    licenseUrl = 'https://opensource.org/licenses/MIT'
    allLicenses = ["MIT"]
    minSdkVersionVal = libs.versions.android.minSdk.get().toInteger()
}

apply from: "../gradle-scripts/commons.gradle"

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    namespace 'com.clevertap.android.pushtemplates'
}

// Note: the progress-centric Live Update (pt_progress) uses androidx.core 1.17.0 APIs
// (NotificationCompat.ProgressStyle + promotion) via REFLECTION (see ProgressStyle.kt), so there is
// deliberately NO build-time dependency on 1.17.0 here — no compileOnly bump and no resolutionStrategy
// force. Consumers keep their own androidx.core; apps that want the native promoted style ship
// androidx.core:core:1.17.0 themselves (TAN §15), and the renderer falls back on older core.
dependencies {
    compileOnly project(':clevertap-core')
    compileOnly (libs.android.material)

    implementation (libs.androidx.core.ktx)
    implementation (libs.androidx.appcompat)
    implementation (libs.android.gif.drawable)

    testImplementation (libs.test.junit)
    testImplementation project(':clevertap-core')
    testImplementation(libs.test.mockk)
    testImplementation(libs.test.robolectric)

    androidTestImplementation (libs.test.ext.junit)
    androidTestImplementation (libs.test.espresso.core)
}