// detekt = Kotlin static analysis. Applied to every SDK module via commons.gradle.
//
// Run the TYPE-RESOLVED task in CI and locally:   ./gradlew :<module>:detektRelease
// The plain `detekt` task has no type resolution and silently skips rules such as
// UnsafeCallOnNullableType, CanBeNonNullable and the `libraries` rule set.
//
// Baselines: existing findings are recorded per module in <module>/detekt-baseline-release.xml
// (regenerate with ./gradlew :<module>:detektBaselineRelease). Only NEW findings fail the build.
// Burn-down list of baselined findings: config/detekt/BASELINE_BURNDOWN.md.
apply plugin: "io.gitlab.arturbosch.detekt"

detekt {
    buildUponDefaultConfig = true        // our config overrides detekt's defaults instead of replacing them
    allRules = false                     // only rules active in the default config or enabled in ours
    parallel = true
    ignoreFailures = false               // build.maxIssues = 0 in detekt.yml: any new finding fails
    config.setFrom(files("${rootDir}/config/detekt/detekt.yml"))
    // One baseline per module: a shared file would be overwritten by each module's baseline task.
    // Variant tasks derive their own file from this one (detekt-baseline-release.xml).
    baseline = file("${projectDir}/detekt-baseline.xml")
}

// TODO(SDK-6378): enable once detekt 1.23.8 + detekt-rules-libraries can be resolved (bump
// detekt_gradle_plugin in libs.versions.toml, uncomment this and the `libraries:` block in detekt.yml,
// then regenerate the baselines). They could not be downloaded when this gate was introduced.
// dependencies {
//     detektPlugins(libs.detekt.rules.libraries)
// }

// Script plugins (`apply from`) can't reference plugin classes by name; load them through the
// detekt plugin's own class loader.
def detektClassLoader = plugins.findPlugin("io.gitlab.arturbosch.detekt").class.classLoader
def detektTaskType = detektClassLoader.loadClass("io.gitlab.arturbosch.detekt.Detekt")
def detektBaselineTaskType = detektClassLoader.loadClass("io.gitlab.arturbosch.detekt.DetektCreateBaselineTask")

tasks.withType(detektTaskType).configureEach {
    jvmTarget = "1.8"                    // matches the modules' Kotlin jvmTarget
    reports {
        html.required.set(true)
        xml.required.set(true)           // machine-readable, used for the burn-down list
        sarif.required.set(true)         // GitHub code scanning
        txt.required.set(false)
        md.required.set(false)
    }
}

tasks.withType(detektBaselineTaskType).configureEach {
    jvmTarget = "1.8"
}
